name: XAUUSD price email

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-price:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch XAU/USD price
        id: gold
        run: |
          resp=$(curl -fsS --retry 3 --max-time 15 https://api.gold-api.com/price/XAU/USD)
          echo "$resp"
          price=$(echo "$resp" | jq -r '.price')
          updated=$(echo "$resp" | jq -r '.updatedAtReadable // .updatedAt // "n/a"')
          if [ -z "$price" ] || [ "$price" = "null" ]; then
            echo "Could not parse price" >&2
            exit 1
          fi
          echo "price=$price" >> "$GITHUB_OUTPUT"
          echo "updated=$updated" >> "$GITHUB_OUTPUT"

      - name: Send mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: true
          username: ${{ secrets.SENDER_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "XAUUSD: ${{ steps.gold.outputs.price }}"
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: "Gold Price Bot <${{ secrets.SENDER_EMAIL }}>"
          body: |
            XAU/USD price: ${{ steps.gold.outputs.price }}
            Updated: ${{ steps.gold.outputs.updated }}
